<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticker Studio Pro - Premium Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; transition: all 0.3s ease; background-color: #f9fafb; color: #111827; overflow-x: hidden; }
        
        /* MODO OSCURO */
        body.theme-dark { background-color: #111827; color: #ffffff; }
        .theme-dark aside { background-color: #1f2937 !important; border-left-color: #374151 !important; color: #ffffff !important; }
        .theme-dark h1, .theme-dark h2, .theme-dark h3, .theme-dark p, .theme-dark span:not(.measure-text) { color: #ffffff !important; }
        .theme-dark label { color: #9ca3af !important; }
        .theme-dark input, .theme-dark select { background-color: #111827 !important; border-color: #4b5563 !important; color: #ffffff !important; }
        
        .theme-dark .option-card { background-color: #374151 !important; border-color: #4b5563 !important; }
        .theme-dark .option-card span { color: #ffffff !important; }
        .theme-dark .option-card.active { border-color: #6366f1 !important; background-color: #4b5563 !important; }

        .theme-dark nav { background-color: rgba(17, 24, 39, 0.95) !important; border-bottom-color: #374151 !important; }
        .theme-dark nav * { color: #ffffff !important; }

        .bg-grid { background-image: radial-gradient(#e5e7eb 1.5px, transparent 1.5px); background-size: 30px 30px; }
        .theme-dark .bg-grid { background-image: radial-gradient(#374151 1.5px, transparent 1.5px); }
        
        #master-wrapper { position: relative; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; perspective: 1200px; padding: 60px; }
        #sticker-container { position: relative; display: flex; align-items: center; justify-content: center; transition: transform 0.1s ease-out; width: 100%; height: 100%; max-width: 600px; max-height: 600px; }
        #sticker-canvas { max-width: 100%; max-height: 100%; z-index: 20; object-fit: contain; display: block; transition: all 0.4s ease; }
        
        /* FILTROS */
        .material-matte #sticker-canvas { filter: drop-shadow(0 15px 30px rgba(0,0,0,0.2)); }
        .material-glossy #sticker-canvas { filter: drop-shadow(0 15px 30px rgba(0,0,0,0.3)); }
        .material-clear #sticker-canvas { filter: drop-shadow(0 20px 40px rgba(0,0,0,0.15)); }

        .effect-layer { position: absolute; z-index: 30; opacity: 0; transition: opacity 0.4s ease; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; mask-size: 100% 100% !important; -webkit-mask-size: 100% 100% !important; }
        #layer-gloss { mix-blend-mode: overlay; background: linear-gradient(135deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.8) 50%, rgba(255,255,255,0) 100%); background-size: 200% 200%; }
        .active-gloss-brillo #layer-gloss { opacity: 1; }

        /* MEDIDAS */
        .measure-line { position: absolute; border: 1px solid #6366f1; opacity: 0.6; pointer-events: none; z-index: 10; }
        .measure-text { position: absolute; font-size: 11px; font-weight: 800; color: #6366f1; background: #f9fafb; padding: 2px 8px; border-radius: 6px; border: 1px solid #e0e7ff; white-space: nowrap; }
        .theme-dark .measure-text { background: #1f2937; border-color: #374151; color: #818cf8; }

        .option-card { border: 2px solid #f3f4f6; transition: all 0.2s; cursor: pointer; background: white; color: black; }
        .option-card.active { border-color: #6366f1; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(99, 102, 241, 0.1); }

        /* CARRITO */
        #cart-sidebar { position: fixed; top: 0; right: 0; height: 100%; width: 100%; max-width: 450px; background: white; box-shadow: -10px 0 30px rgba(0,0,0,0.1); transform: translateX(100%); transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1); z-index: 110; display: flex; flex-direction: column; }
        #cart-sidebar.open { transform: translateX(0); }
        #cart-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); z-index: 90; opacity: 0; pointer-events: none; transition: opacity 0.5s ease; }
        #cart-overlay.visible { opacity: 1; pointer-events: auto; }
        .theme-dark #cart-sidebar { background: #111827; border-left: 1px solid #374151; }
        .theme-dark #cart-sidebar .bg-white { background-color: #111827 !important; }
        .theme-dark #cart-sidebar .bg-gray-50 { background-color: #1f2937 !important; }
        #white-border-canvas {
    position: absolute;
    z-index: 15;
    pointer-events: none;
    max-width: 100%;
    max-height: 100%;
}

#sticker-canvas {
    position: relative;
    z-index: 20;
}

#cut-line-canvas {
    position: absolute;
    z-index: 45;
    pointer-events: none;
    max-width: 100%;
    max-height: 100%;
    opacity: 0.75;
}
    </style>

    <svg style="position: absolute; width: 0; height: 0;">
        <filter id="matte-contour-filter" color-interpolation-filters="sRGB">
            <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur" />
            <feComponentTransfer in="blur" result="limit"><feFuncA type="discrete" tableValues="0 0 0 1 1" /></feComponentTransfer>
            <feMorphology id="matte-border-size" in="limit" operator="dilate" radius="10" result="border" />
            <feFlood id="matte-border-color" flood-color="white" flood-opacity="1" result="pure-white"/>
            <feComposite in="pure-white" in2="border" operator="in" result="final-border" />
            <feMerge><feMergeNode in="final-border" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
        <filter id="clear-contour-filter" color-interpolation-filters="sRGB">
            <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur" />
            <feComponentTransfer in="blur" result="limit">
                <feFuncA type="discrete" tableValues="0 0 0 0 1 1" />
            </feComponentTransfer>
            <feMorphology id="clear-border-size" in="limit" operator="dilate" radius="10" result="border" />
            <feFlood flood-color="#ffffff" flood-opacity="0.3" result="transparent-edge"/>
            <feComposite in="transparent-edge" in2="border" operator="in" result="final-border" />
            <feMerge>
                <feMergeNode in="final-border" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
        <filter id="cut-line-filter" color-interpolation-filters="sRGB">
            <feGaussianBlur in="SourceAlpha" stdDeviation="1" result="blur" />
            <feComponentTransfer in="blur" result="limit">
                <feFuncA type="discrete" tableValues="0 0 0 0 1 1" />
            </feComponentTransfer>

            <feMorphology id="cut-line-size" in="limit" operator="dilate" radius="18" result="outer" />
            <feMorphology id="cut-line-inner" in="limit" operator="dilate" radius="12" result="inner" />

            <feComposite in="outer" in2="inner" operator="out" result="cut-ring" />
            <feFlood flood-color="#ff3b30" flood-opacity="0.8" result="cut-red" />
            <feComposite in="cut-red" in2="cut-ring" operator="in" result="final-cut" />

            <feMerge>
                <feMergeNode in="final-cut" />
            </feMerge>
        </filter>
    </svg>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();
        const cutCanvas = document.getElementById('cut-line-canvas');
        const cutCtx = cutCanvas.getContext('2d');
        const whiteBorderCanvas =
        document.getElementById('white-border-canvas');

        const whiteBorderCtx =
            whiteBorderCanvas.getContext('2d');
        const canvas = document.getElementById('sticker-canvas'), ctx = canvas.getContext('2d', { willReadFrequently: true });
        const master = document.getElementById('master-wrapper'), container = document.getElementById('sticker-container');
        let originalImg = new Image();
        let currentMaterialLabel = "MATTE WHITE";
        let currentMaterialType = "matte";
        let currentBorderRadius = 10;
        let currentBorderLabel = "Standard";
        let pendingRenderFrame = null;

        function scheduleRender() {
            if (pendingRenderFrame) {
                cancelAnimationFrame(pendingRenderFrame);
            }

            pendingRenderFrame = requestAnimationFrame(() => {
                pendingRenderFrame = null;
                renderAll();
            });
        }


        function setBorderThickness(radius, btn) {
            currentBorderRadius = radius;

            currentBorderLabel = btn
                .querySelector('span')
                .textContent
                .trim();

            document.querySelectorAll('.border-card')
                .forEach(card => card.classList.remove('active'));

            btn.classList.add('active');

            scheduleRender();
        }

        window.onload = function() {
            originalImg.crossOrigin = "anonymous";
            originalImg.src = localStorage.getItem('tempStickerImage') || 'https://raw.githubusercontent.com/lucide-icons/lucide/main/icons/star.svg';
            
            const fileData = localStorage.getItem('tempStickerImage');
            const fileType = localStorage.getItem('tempStickerFileType');

            if (fileType === "application/pdf") {
                renderPdfPreview(fileData);
            } else {
                originalImg.src = fileData || 'https://raw.githubusercontent.com/lucide-icons/lucide/main/icons/star.svg';
            }
            // CARGA DE CONFIGURACIÓN PREVIA
            const config = JSON.parse(localStorage.getItem('tempStickerConfig') || '{}');
            if (config.details) {
                // Extraer valores del string de detalles
                const details = config.details.toUpperCase();
                
                // Set Shape
                if (details.includes("SQUARE")) document.getElementById('select-shape').value = "square";
                else if (details.includes("CIRCLE")) document.getElementById('select-shape').value = "circle";
                else document.getElementById('select-shape').value = "contour cut";

                // Set Finish
                if (details.includes("MATTE")) applyMaterial('matte', document.getElementById('btn-matte'));
                else if (details.includes("GLOSSY")) applyMaterial('gloss', document.getElementById('btn-gloss'));
                else if (details.includes("CLEAR")) applyMaterial('clear', document.getElementById('btn-clear'));
                else applyMaterial('matte', document.getElementById('btn-matte'));

                // Set Size desde tempStickerConfig
                if (config.width && config.height) {
                    document.getElementById('input-width').value = parseFloat(config.width).toFixed(2);
                    document.getElementById('input-height').value = parseFloat(config.height).toFixed(2);
                }

                // Set Qty
                if (details.includes("QTY:")) {
                    const qtyVal = details.split("QTY:")[1].trim().split(" ")[0];
                    document.getElementById('qty-input').value = parseInt(qtyVal) || 1;
                }
            } else {
                applyMaterial('matte', document.getElementById('btn-matte'));
            }

            originalImg.onload = renderAll;
            renderCart();
        };

        function enforceLimit(input) {
            let value = parseFloat(input.value);

            if (isNaN(value)) {
                input.value = "1.00";
                return;
            }

            // Limitar entre 1 y 11
            value = Math.max(1, Math.min(11, value));

            // Redondear al múltiplo de 0.25 más cercano
            value = Math.round(value / 0.25) * 0.25;

            // Mostrar siempre dos decimales
            input.value = value.toFixed(2);

            scheduleRender();
        }

        function toggleTheme() {
            document.body.classList.toggle('theme-dark');
            const isDark = document.body.classList.contains('theme-dark');
            document.getElementById('pill-bg').style.transform = isDark ? 'translateX(100%)' : 'translateX(0%)';
        }



        function renderAll() {
            if (!originalImg.width) return;

            let width = parseFloat(document.getElementById('input-width').value) || 1;
            let height = parseFloat(document.getElementById('input-height').value) || 1;
            let qty = parseInt(document.getElementById('qty-input').value) || 1;
            let shape = document.getElementById('select-shape').value;
            const borderOptions = document.getElementById("border-options");

            if (shape === "contour cut") {
                borderOptions.style.display = "block";
            } else {
                borderOptions.style.display = "none";
            }

            const widthInput = document.getElementById('input-width');
        const heightInput = document.getElementById('input-height');

        if (document.activeElement !== widthInput) {
            width = Math.max(1, Math.min(11, Math.round(width / 0.25) * 0.25));
            widthInput.value = width.toFixed(2);
        }

        if (document.activeElement !== heightInput) {
            height = Math.max(1, Math.min(11, Math.round(height / 0.25) * 0.25));
            heightInput.value = height.toFixed(2);
        }

            document.getElementById('text-h').innerText = `${width.toFixed(2)}"`;
            document.getElementById('text-v').innerText = `${height.toFixed(2)}"`;

            const result = calculateStickerPrice(
                "custom-sticker",
                width,
                height,
                qty,
                currentMaterialType
            );

            document.getElementById('price-display').innerText = `$${result.total.toFixed(2)}`;
            document.getElementById('each-price').innerText =
            `$${(result.total / qty).toFixed(2)} each`;

            const maxPreviewSize = 420;
            const padding = 80;

            const largestSide = Math.max(width, height);

            const scale = maxPreviewSize / largestSide;

            const canvasW = width * scale;
            const canvasH = height * scale;

            canvas.width = canvasW + padding;
            canvas.height = canvasH + padding;

            const drawX = padding / 2;
            const drawY = padding / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();

            if (shape === 'circle') {
    const side = Math.min(canvasW, canvasH);
    const circleX = canvas.width / 2;
    const circleY = canvas.height / 2;
    const radius = side / 2;

    // Crear base circular
    ctx.beginPath();
    ctx.arc(circleX, circleY, radius, 0, Math.PI * 2);
    ctx.closePath();

    ctx.fillStyle = getStickerBackground();
    ctx.fill();

    // Recortar la imagen dentro del círculo
    ctx.clip();

    drawCoverImage(
        ctx,
        originalImg,
        circleX - radius,
        circleY - radius,
        side,
        side
    );

    } else if (shape === 'square') {
        // Crear base cuadrada/rectangular
        ctx.fillStyle = getStickerBackground();
        ctx.fillRect(drawX, drawY, canvasW, canvasH);

        // Recortar la imagen dentro del cuadrado
        ctx.beginPath();
        ctx.rect(drawX, drawY, canvasW, canvasH);
        ctx.clip();

        drawCoverImage(
            ctx,
            originalImg,
            drawX,
            drawY,
            canvasW,
            canvasH
        );

    } else {
        // Contour Cut: conservar transparencia original
        drawCoverImage(
            ctx,
            originalImg,
            drawX,
            drawY,
            canvasW,
            canvasH
        );
    }

            ctx.restore();

                let sharedBorderMask = null;

                if (shape === 'contour cut') {
                    sharedBorderMask = createSmoothExpandedMask(
                        canvas,
                        currentBorderRadius
                    );
                }

                drawWhiteBorder(shape, sharedBorderMask);

                drawCutLine(
                    shape,
                    drawX,
                    drawY,
                    canvasW,
                    canvasH,
                    sharedBorderMask
                );

            container.style.width = `${canvas.width}px`;
            container.style.height = `${canvas.height}px`;

            setTimeout(syncLayers, 100);
        }

        function getTrimmedBounds(image) {
            const temp = document.createElement('canvas');
            const tctx = temp.getContext('2d');

            temp.width = image.width;
            temp.height = image.height;

            tctx.drawImage(image, 0, 0);

            const data = tctx.getImageData(
                0,
                0,
                temp.width,
                temp.height
            ).data;

            let minX = temp.width;
            let minY = temp.height;
            let maxX = 0;
            let maxY = 0;

            for (let y = 0; y < temp.height; y++) {
                for (let x = 0; x < temp.width; x++) {

                    const alpha = data[(y * temp.width + x) * 4 + 3];

                    if (alpha > 0) {
                        minX = Math.min(minX, x);
                        minY = Math.min(minY, y);
                        maxX = Math.max(maxX, x);
                        maxY = Math.max(maxY, y);
                    }
                }
            }

            return {
                sx: minX,
                sy: minY,
                sw: maxX - minX,
                sh: maxY - minY
            };
        }
        
        function drawCoverImage(ctx, img, x, y, w, h) {
            const imgRatio = img.width / img.height, targetRatio = w / h;
            let sx, sy, sw, sh;
            if (imgRatio > targetRatio) { sh = img.height; sw = img.height * targetRatio; sx = (img.width - sw) / 2; sy = 0; }
            else { sw = img.width; sh = img.width / targetRatio; sx = 0; sy = (img.height - sh) / 2; }
            const bounds = getTrimmedBounds(img);

            ctx.drawImage(
                img,
                bounds.sx,
                bounds.sy,
                bounds.sw,
                bounds.sh,
                x,
                y,
                w,
                h
            );
        }

        function getStickerBackground() {
            if (currentMaterialType === 'clear') {
                return 'rgba(255, 255, 255, 0.25)';
            }

            return '#ffffff';
        }

        function applyMaterial(type, btn) {
            currentMaterialType = type;

            document.querySelectorAll('.material-card').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');

            if(type === 'matte') {

            } else if(type === 'gloss') {

            } else if(type === 'clear') { 
                container.classList.add('material-clear');

            scheduleRender();
            syncLayers();
        }

        function createSmoothExpandedMask(sourceCanvas, radius) {
    const width = sourceCanvas.width;
    const height = sourceCanvas.height;

    const maskCanvas = document.createElement('canvas');
    const maskCtx = maskCanvas.getContext('2d', {
        willReadFrequently: true
    });

    maskCanvas.width = width;
    maskCanvas.height = height;

    const blurAmount = Math.max(1.5, radius * 0.28);

    const steps = Math.max(
        64,
        Math.ceil(radius * 8)
    );

    const threshold = 40;

    maskCtx.save();
    maskCtx.filter = `blur(${blurAmount}px)`;

    // Centro
    maskCtx.drawImage(sourceCanvas, 0, 0);

    // Expansión circular suave
    for (let i = 0; i < steps; i++) {
        const angle = (Math.PI * 2 * i) / steps;

        const extraPadding = radius * 0.25;

        const offsetX =
            Math.cos(angle) * (radius + extraPadding);

        const offsetY =
            Math.sin(angle) * (radius + extraPadding);

        maskCtx.drawImage(
            sourceCanvas,
            offsetX,
            offsetY
        );
    }

    maskCtx.restore();

    const imageData = maskCtx.getImageData(
        0,
        0,
        width,
        height
    );

    const pixels = imageData.data;
    

    for (let i = 0; i < pixels.length; i += 4) {
        const visible = pixels[i + 3] >= threshold;

        pixels[i] = 255;
        pixels[i + 1] = 255;
        pixels[i + 2] = 255;
        pixels[i + 3] = visible ? 255 : 0;
    }

    maskCtx.clearRect(0, 0, width, height);
    maskCtx.putImageData(imageData, 0, 0);

    return maskCanvas;
}

    function drawWhiteBorder(shape, borderMask = null) {
        whiteBorderCanvas.width = canvas.width;
        whiteBorderCanvas.height = canvas.height;

        whiteBorderCtx.clearRect(
            0,
            0,
            whiteBorderCanvas.width,
            whiteBorderCanvas.height
        );

        if (shape !== 'contour cut' || !borderMask) {
            return;
        }

        whiteBorderCtx.save();
        whiteBorderCtx.drawImage(borderMask, 0, 0);

        whiteBorderCtx.globalCompositeOperation = 'source-in';

        if (currentMaterialType === 'clear') {
            whiteBorderCtx.fillStyle =
                createTransparencyPattern(whiteBorderCtx);
        } else {
            whiteBorderCtx.fillStyle = '#ffffff';
        }

        whiteBorderCtx.fillRect(
            0,
            0,
            whiteBorderCanvas.width,
            whiteBorderCanvas.height
        );

        whiteBorderCtx.restore();
    }

function buildProductionCanvas() {
    const shape = document.getElementById('select-shape').value;

    const productionCanvas = document.createElement('canvas');
    const productionCtx = productionCanvas.getContext('2d');

    productionCanvas.width = canvas.width;
    productionCanvas.height = canvas.height;

    productionCtx.clearRect(
        0,
        0,
        productionCanvas.width,
        productionCanvas.height
    );

    if (shape === 'contour cut') {
        /*
         * Usamos exactamente el borde blanco que ya ve el cliente.
         * No volvemos a construirlo desde el canvas completo.
         */
        productionCtx.drawImage(
            whiteBorderCanvas,
            0,
            0
        );

        /*
         * Dibujamos la imagen encima.
         */
        productionCtx.drawImage(
            canvas,
            0,
            0
        );

        return trimTransparentCanvas(
            productionCanvas,
            2
        );
    }

    /*
     * Para círculo y cuadrado el canvas principal
     * ya contiene la forma seleccionada.
     */
    productionCtx.drawImage(
        canvas,
        0,
        0
    );

    return trimTransparentCanvas(
        productionCanvas,
        2
    );
}

function trimTransparentCanvas(sourceCanvas, padding = 2) {
    const sourceCtx = sourceCanvas.getContext('2d', {
        willReadFrequently: true
    });

    const width = sourceCanvas.width;
    const height = sourceCanvas.height;

    const imageData = sourceCtx.getImageData(
        0,
        0,
        width,
        height
    );

    const pixels = imageData.data;

    let minX = width;
    let minY = height;
    let maxX = -1;
    let maxY = -1;

    for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
            const alpha =
                pixels[(y * width + x) * 4 + 3];

            if (alpha > 10) {
                minX = Math.min(minX, x);
                minY = Math.min(minY, y);
                maxX = Math.max(maxX, x);
                maxY = Math.max(maxY, y);
            }
        }
    }

    if (maxX < minX || maxY < minY) {
        return sourceCanvas;
    }

    minX = Math.max(0, minX - padding);
    minY = Math.max(0, minY - padding);
    maxX = Math.min(width - 1, maxX + padding);
    maxY = Math.min(height - 1, maxY + padding);

    const trimmedCanvas = document.createElement('canvas');

    trimmedCanvas.width = maxX - minX + 1;
    trimmedCanvas.height = maxY - minY + 1;

    const trimmedCtx = trimmedCanvas.getContext('2d');

    trimmedCtx.drawImage(
        sourceCanvas,
        minX,
        minY,
        trimmedCanvas.width,
        trimmedCanvas.height,
        0,
        0,
        trimmedCanvas.width,
        trimmedCanvas.height
    );

    return trimmedCanvas;
}

function getProductionImage() {
    const productionCanvas = buildProductionCanvas();

    return productionCanvas.toDataURL(
        'image/png',
        1
    );
}

        function addToCart() {

         function renderCart() {
            const cart = JSON.parse(localStorage.getItem('sqft_cart')) || [];
            const container = document.getElementById('cart-items-container');
            if (!container) return;
            container.innerHTML = ''; let total = 0;

            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-gray-300 font-black italic text-[11px]">Bag Empty</div>`;
                const dot = document.getElementById('cart-dot');
                if(dot) dot.classList.add('hidden');
            } else {
                const dot = document.getElementById('cart-dot');
                if(dot) dot.classList.remove('hidden');
                cart.forEach((item, i) => {
                    const priceNum = typeof item.price === 'string' ? parseFloat(item.price.replace(/[$,]/g, '')) : (item.price || 0);
                    total += priceNum;
                    
                    // REPARACIÓN: Detectamos si la info viene como details, specs u options
                    const showDetails = item.details || item.specs || (item.options ? Object.entries(item.options).map(([k, v]) => `${k}: ${v}`).join(' | ') : "NO INFO");

                    container.innerHTML += `
                        <div class="flex gap-4 border-b pb-6 text-black">
                            <div class="w-16 h-16 bg-gray-50 rounded-xl border flex items-center justify-center shrink-0">
                                <img src="${item.image}" class="max-h-full max-w-full object-contain">
                            </div>
                            <div class="flex-grow py-1 text-black">
                                <div class="flex justify-between font-black uppercase italic text-xs">
                                    <span>${item.name}</span>
                                    <button onclick="removeItem(${i})" class="text-gray-300 hover:text-red-500">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                </div>
                                <p class="text-[9px] text-gray-400 font-bold uppercase mt-1 leading-tight">${showDetails}</p>
                                <span class="text-lg font-black italic">$${priceNum.toFixed(2)}</span>
                            </div>
                        </div>`;
                });
            }
            const totalDisp = document.getElementById('cart-total-price');
            if(totalDisp) totalDisp.innerText = `$${total.toFixed(2)}`;
            const countDisp = document.getElementById('cart-count-text');
            if(countDisp) countDisp.innerText = `${cart.length} items`;
            if (window.lucide && typeof window.lucide.createIcons === 'function') window.lucide.createIcons();
        }

        function removeItem(i) {
            let cart = JSON.parse(localStorage.getItem('sqft_cart')) || [];
            cart.splice(i, 1);
            localStorage.setItem('sqft_cart', JSON.stringify(cart));
            renderCart();
        }

        function drawCutLine(shape, x, y, w, h, sharedBorderMask = null) {
            cutCanvas.width = canvas.width;
            cutCanvas.height = canvas.height;

            cutCtx.clearRect(0, 0, cutCanvas.width, cutCanvas.height);
            cutCtx.save();

            // En círculo y cuadrado dibujamos la línea directamente
            if (shape === 'circle') {
                cutCanvas.style.filter = 'none';

                const side = Math.min(w, h);
                const radius = side / 2 + 4;

                cutCtx.strokeStyle = '#ff3b30';
                cutCtx.lineWidth = 3;
                cutCtx.setLineDash([8, 6]);

                cutCtx.beginPath();
                cutCtx.arc(
                    cutCanvas.width / 2,
                    cutCanvas.height / 2,
                    radius,
                    0,
                    Math.PI * 2
                );
                cutCtx.stroke();

            } else if (shape === 'square') {
                cutCanvas.style.filter = 'none';

                cutCtx.strokeStyle = '#ff3b30';
                cutCtx.lineWidth = 3;
                cutCtx.setLineDash([8, 6]);

                cutCtx.strokeRect(
                    x - 4,
                    y - 4,
                    w + 8,
                    h + 8
                );

            } else {
                cutCanvas.style.filter = 'none';

                drawContourCutLine(sharedBorderMask);
            }

            cutCtx.restore();
        }

        function drawContourCutLine(innerMask) {
    if (!innerMask) return;

    const lineThickness = 2;

    const outerMask = createSmoothExpandedMask(
        canvas,
        currentBorderRadius + lineThickness
    );

    cutCtx.save();

    cutCtx.drawImage(outerMask, 0, 0);

    cutCtx.globalCompositeOperation = 'destination-out';
    cutCtx.drawImage(innerMask, 0, 0);

    cutCtx.globalCompositeOperation = 'source-in';
    cutCtx.fillStyle = '#ff3b30';

    cutCtx.fillRect(
        0,
        0,
        cutCanvas.width,
        cutCanvas.height
    );

    cutCtx.restore();
}

        function syncShapeDimensions(changedInput) {
            const shape = document.getElementById('select-shape').value;

            if (shape !== 'circle' && shape !== 'square') return;

            const widthInput = document.getElementById('input-width');
            const heightInput = document.getElementById('input-height');

            if (changedInput.id === 'input-width') {
                heightInput.value = changedInput.value;
            } else {
                widthInput.value = changedInput.value;
            }
        }

        function handleShapeChange() {
            const shape = document.getElementById('select-shape').value;
            const widthInput = document.getElementById('input-width');
            const heightInput = document.getElementById('input-height');

            if (shape === 'circle' || shape === 'square') {
                const size = parseFloat(widthInput.value) || 1;

                widthInput.value = size.toFixed(2);
                heightInput.value = size.toFixed(2);
            }

            scheduleRender();
        }

        function createTransparencyPattern(targetCtx) {
            const patternCanvas = document.createElement('canvas');
            const patternCtx = patternCanvas.getContext('2d');

            const size = 16;

            patternCanvas.width = size;
            patternCanvas.height = size;

            patternCtx.fillStyle = '#f3f4f6';
            patternCtx.fillRect(0, 0, size, size);

            patternCtx.fillStyle = '#d1d5db';
            patternCtx.fillRect(0, 0, size / 2, size / 2);
            patternCtx.fillRect(
                size / 2,
                size / 2,
                size / 2,
                size / 2
            );

            return targetCtx.createPattern(
                patternCanvas,
                'repeat'
            );
        }

        master.addEventListener('mousemove', (e) => {
            const rect = master.getBoundingClientRect();
            const x = (e.clientX - (rect.left + rect.width/2)) / (rect.width/2);
            const y = (e.clientY - (rect.top + rect.height/2)) / (rect.height/2);
            container.style.transform = `rotateX(${y * -10}deg) rotateY(${x * 10}deg) scale(1.02)`;
            document.getElementById('layer-gloss').style.backgroundPosition = `${50 + (x * 50)}% ${50 + (y * 50)}%`;
        });
        master.addEventListener('mouseleave', () => container.style.transform = 'none');

        async function renderPdfPreview(pdfDataUrl) {
            const pdfData = atob(pdfDataUrl.split(',')[1]);
            const uint8Array = new Uint8Array(pdfData.length);

            for (let i = 0; i < pdfData.length; i++) {
                uint8Array[i] = pdfData.charCodeAt(i);
            }

            const pdf = await pdfjsLib.getDocument({ data: uint8Array }).promise;
            const page = await pdf.getPage(1);
            const viewport = page.getViewport({ scale: 1.5 });

            const tempCanvas = document.createElement('canvas');
            const tempCtx = tempCanvas.getContext('2d');

            tempCanvas.width = viewport.width;
            tempCanvas.height = viewport.height;

            await page.render({
                canvasContext: tempCtx,
                viewport: viewport
            }).promise;

            originalImg.src = tempCanvas.toDataURL('image/png');
            originalImg.onload = () => {
                renderAll();

            };
        }
